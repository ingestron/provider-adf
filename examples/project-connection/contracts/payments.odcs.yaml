apiVersion: v3.1.0
kind: DataContract
id: sales-payments
name: Sales payments
version: 1.0.0
status: draft
description:
  purpose: Authored contract for the fictional NZ sales source.
schema:
  - name: payments
    logicalType: object
    physicalType: table
    properties:
      - name: payment_id
        logicalType: integer
        physicalType: BIGINT
        required: true
        primaryKey: true
      - name: invoice_id
        logicalType: integer
        physicalType: BIGINT
        required: true
      - name: payment_date
        logicalType: string
        physicalType: STRING
        required: true
      - name: amount
        logicalType: number
        physicalType: DECIMAL(20,2)
        required: true
