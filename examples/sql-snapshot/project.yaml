apiVersion: ingestron.project/v1
id: retail
providers:
  packages:
    adf:
      source: adf
      version: 2.3.1
  configurations:
    landing:
      package: adf
      binding: factory
defaults:
  provider: landing
environments:
  dev:
    apiVersion: ingestron.environment/v1
    environment: dev
    bindings:
      factory:
        kind: adf
        factoryName: adf-retail-dev
  prod:
    apiVersion: ingestron.environment/v1
    environment: prod
    bindings:
      factory:
        kind: adf
        factoryName: adf-retail-prod
flows:
  - apiVersion: ingestron.flow/v1
    kind: ingestion
    id: source
    ingestion:
      standard: snapshot-land@v1
      target:
        linkedService: landing_adls
        fileSystem: landing
        path: retail
    defaults:
      source:
        kind: azure-sql
        linkedService: source_sql
        schema: dbo
        table: customers
        consistency: frozen-extract
    tables:
      customers:
        contract:
          apiVersion: v3.1.0
          kind: DataContract
          id: customers
          name: customers
          version: 1.0.0
          status: draft
          schema:
            - name: customers
              logicalType: object
              physicalType: table
              properties:
                - name: id
                  logicalType: integer
                  physicalType: BIGINT
                  required: true
                  primaryKey: true
                - name: name
                  logicalType: string
                  physicalType: STRING
