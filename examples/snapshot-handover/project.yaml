apiVersion: ingestron.project/v1
id: retail
providers:
  packages:
    provider:
      source: adf
      version: 2.3.1
  configurations:
    engineering:
      package: provider
      binding: engine
defaults:
  provider: engineering
environments:
  dev:
    apiVersion: ingestron.environment/v1
    environment: dev
    values:
      storageAccount: retailsampledev
      publisherNotebook: /Workspace/Shared/retail_publication/dev/files/notebooks/retail_source_customers
      publisherPrincipal: retail-publisher-dev
      clusterId: 0123-exampledev
    bindings:
      engine:
        kind: adf
        factoryName: adf-retail-dev
      files:
        kind: adls
  prod:
    apiVersion: ingestron.environment/v1
    environment: prod
    values:
      storageAccount: retailsampleprod
      publisherNotebook: /Workspace/Shared/retail_publication/prod/files/notebooks/retail_source_customers
      publisherPrincipal: retail-publisher-prod
      clusterId: 0123-exampleprod
    bindings:
      engine:
        kind: adf
        factoryName: adf-retail-prod
      files:
        kind: adls
flows:
  - apiVersion: ingestron.flow/v1
    kind: ingestion
    id: source
    ingestion:
      standard: snapshot-to-databricks@v1
      target:
        linkedService: landing_adls
        fileSystem: landing
        storageAccount: "{{values.storageAccount}}"
        path: retail
      publication:
        linkedService: publisher_databricks
        notebookPath: "{{values.publisherNotebook}}"
        protocol: ingestron.snapshot-publication/v1
    defaults:
      source:
        kind: azure-sql
        linkedService: source_sql
        schema: dbo
        table: IngestronSnapshotDemo
        consistency: frozen-extract
    tables:
      customers:
        contract:
          apiVersion: v3.1.0
          kind: DataContract
          id: customers
          name: customers
          version: 1.0.0
          status: draft
          schema:
            - name: customers
              logicalType: object
              physicalType: table
              properties:
                - name: id
                  logicalType: integer
                  physicalType: BIGINT
                  required: true
                  primaryKey: true
                - name: name
                  logicalType: string
                  physicalType: STRING
