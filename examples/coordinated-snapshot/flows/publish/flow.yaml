apiVersion: ingestron.flow/v1
kind: ingestion
id: publish
ingestion:
  standard: snapshot-publication@v1
  credential:
    secretScope: retail_storage_{{env}}
    tenantIdKey: tenant-id
    clientIdKey: client-id
    clientSecretKey: client-secret
  maximumDropPercent: 50
defaults:
  source:
    from: requires.landing
tables:
  customers:
    contract:
      apiVersion: v3.1.0
      kind: DataContract
      id: customers
      name: customers
      version: 1.0.0
      status: draft
      schema:
        - name: customers
          logicalType: object
          physicalType: table
          properties:
            - name: id
              logicalType: integer
              physicalType: BIGINT
              required: true
              primaryKey: true
            - name: name
              logicalType: string
              physicalType: STRING
provider: publisher
requires:
  landing:
    dataset: retail.source.customers.snapshot
    select:
      mode: same-run
    handover: files
