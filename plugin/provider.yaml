apiVersion: ingestron.provider/v1
id: adf-native
version: 4.7.0
platform: adf
compatibility:
  plan: ingestron.plan/v1
  minimumCli: 4.2.0
  requiredFeatures:
    - native-project
    - delivery-exports
    - export-groups
    - model-inputs
    - extension-packs
    - ingestion-presets
    - relation-handovers
    - project-connections
    - odcs-connections
    - connector-runtime-capabilities
    - project-assembly
    - quality-capabilities
    - source-coverage
sources:
  sql-server:
    route: native
    discovery:
      command: discover route
    standards:
      - snapshot-land@v1
      - snapshot-to-databricks@v1
      - metadata-snapshot-land@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-sql-server
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/introduction
        note: An existing data factory and linked services
      auth:
        - linked-service
      network:
        - public
        - private-network
        - on-premises
      maturity: preview
      verified: 2026-09-30
      note:
        SQL Server and Azure SQL through Copy; set variant to match the linked
        service; private sources need a self-hosted integration runtime
    bindingSchema:
      type: object
      required:
        - linkedService
        - variant
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
        variant:
          enum:
            - azure-sql
            - sql-server
      additionalProperties: false
    source:
      kind: "{{binding.variant}}"
      linkedService: "{{binding.linkedService}}"
      consistency: frozen-extract
  postgresql:
    route: native
    discovery:
      command: discover route
    standards:
      - snapshot-land@v1
      - snapshot-to-databricks@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-postgresql
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/introduction
        note: An existing data factory and linked services
      auth:
        - linked-service
      network:
        - public
        - private-network
        - on-premises
      maturity: preview
      verified: 2026-09-30
      note: PostgreSQL V2 connector, PostgreSQL 12 and later
    bindingSchema:
      type: object
      required:
        - linkedService
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
      additionalProperties: false
    source:
      kind: postgresql
      linkedService: "{{binding.linkedService}}"
      consistency: frozen-extract
  mysql:
    route: native
    discovery:
      command: discover route
    standards:
      - snapshot-land@v1
      - snapshot-to-databricks@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-mysql
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/introduction
        note: An existing data factory and linked services
      auth:
        - linked-service
      network:
        - public
        - private-network
        - on-premises
      maturity: preview
      verified: 2026-09-30
      note: MySQL connector version 2.0; the table schema names the database
    bindingSchema:
      type: object
      required:
        - linkedService
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
      additionalProperties: false
    source:
      kind: mysql
      linkedService: "{{binding.linkedService}}"
      consistency: frozen-extract
  oracle:
    route: native
    discovery:
      command: discover route
    standards:
      - snapshot-land@v1
      - snapshot-to-databricks@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-oracle
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/introduction
        note: An existing data factory and linked services
      auth:
        - linked-service
      network:
        - public
        - private-network
        - on-premises
      maturity: preview
      verified: 2026-09-30
      note: Oracle connector version 2.0
    bindingSchema:
      type: object
      required:
        - linkedService
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
      additionalProperties: false
    source:
      kind: oracle
      linkedService: "{{binding.linkedService}}"
      consistency: frozen-extract
  azure-blob:
    route: native
    standards:
      - immutable-file-copy@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-azure-data-lake-storage
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/introduction
        note: An existing data factory and linked services
      auth:
        - linked-service
      network:
        - public
        - private-network
        - on-premises
      maturity: preview
      verified: 2026-09-30
      note:
        Copies one completed file unchanged; it does not parse it into contract
        columns
    bindingSchema:
      type: object
      required:
        - linkedService
        - fileSystem
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
        fileSystem:
          type: string
          minLength: 3
          maxLength: 63
      additionalProperties: false
    source:
      kind: adls
      linkedService: "{{binding.linkedService}}"
      fileSystem: "{{binding.fileSystem}}"
      completion: immutable
  s3:
    route: native
    standards:
      - immutable-file-copy@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-amazon-simple-storage-service
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/introduction
        note: An existing data factory and linked services
      auth:
        - linked-service
      network:
        - public
        - private-network
        - on-premises
      maturity: preview
      verified: 2026-09-30
      note:
        Copies one completed file unchanged; it does not parse it into contract
        columns
    bindingSchema:
      type: object
      required:
        - linkedService
        - bucket
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
        bucket:
          type: string
          minLength: 3
          maxLength: 63
      additionalProperties: false
    source:
      kind: s3
      linkedService: "{{binding.linkedService}}"
      bucket: "{{binding.bucket}}"
      completion: immutable
  gcs:
    route: native
    standards:
      - immutable-file-copy@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-google-cloud-storage
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/introduction
        note: An existing data factory and linked services
      auth:
        - linked-service
      network:
        - public
        - private-network
        - on-premises
      maturity: preview
      verified: 2026-09-30
      note:
        Copies one completed file unchanged; it does not parse it into contract
        columns
    bindingSchema:
      type: object
      required:
        - linkedService
        - bucket
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
        bucket:
          type: string
          minLength: 3
          maxLength: 63
      additionalProperties: false
    source:
      kind: gcs
      linkedService: "{{binding.linkedService}}"
      bucket: "{{binding.bucket}}"
      completion: immutable
  sftp:
    route: native
    standards:
      - immutable-file-copy@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-sftp
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/introduction
        note: An existing data factory and linked services
      auth:
        - linked-service
      network:
        - public
        - private-network
        - on-premises
      maturity: preview
      verified: 2026-09-30
      note:
        Copies one completed file unchanged; it does not parse it into contract
        columns
    bindingSchema:
      type: object
      required:
        - linkedService
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
      additionalProperties: false
    source:
      kind: sftp
      linkedService: "{{binding.linkedService}}"
      completion: immutable
  sharepoint:
    route: native
    standards:
      - sharepoint-list-land@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-sharepoint-online-list
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/connector-sharepoint-online-list
        note:
          A SharePoint Online List linked service with service principal certificate
          authentication
      auth:
        - service-principal-certificate
      network:
        - public
      maturity: preview
      verified: 2026-09-30
      note:
        Lists only, read live without a point-in-time guarantee; SharePoint files
        are not a native ADF route
    bindingSchema:
      type: object
      required:
        - linkedService
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
      additionalProperties: false
    source:
      kind: sharepoint-list
      linkedService: "{{binding.linkedService}}"
  salesforce:
    route: native
    standards:
      - app-land@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-salesforce
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/connector-salesforce
        note:
          A Salesforce V2 linked service (connected app with client credentials);
          Salesforce Developer Edition is free
      auth:
        - oauth2-client-credentials
      network:
        - public
      maturity: preview
      verified: 2026-09-30
      note: SOQL selects the reviewed contract fields; read live without a
        point-in-time guarantee; Bulk API 2.0 limits apply
    bindingSchema:
      type: object
      required:
        - linkedService
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
      additionalProperties: false
    source:
      kind: salesforce
      linkedService: "{{binding.linkedService}}"
  hubspot:
    route: native
    standards:
      - app-land@v1
    capabilities:
      - snapshot
    reference:
      docs: https://learn.microsoft.com/azure/data-factory/connector-hubspot
      vendorStatus: ga
      licence: Microsoft Azure service terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://azure.microsoft.com/pricing/details/data-factory/data-pipeline/
        note: Copy activity and pipeline orchestration run as Data Factory usage
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/data-factory/connector-hubspot
        note: A HubSpot 2.0 linked service with OAuth app credentials
      auth:
        - oauth
      network:
        - public
      maturity: preview
      verified: 2026-09-30
      note: Named HubSpot 2.0 tables (portable names such as contacts map to
        CRM.Objects.Contacts); no query, so fields are selected by the reviewed
        column mapping; read live
    bindingSchema:
      type: object
      required:
        - linkedService
      properties:
        linkedService:
          type: string
          minLength: 1
          maxLength: 101
      additionalProperties: false
    source:
      kind: hubspot
      linkedService: "{{binding.linkedService}}"
quality:
  library: {}
  standards:
    snapshot-land@v1:
      library:
        nullValues: at-load
        missingValues: at-load
        invalidValues: at-load
        duplicateValues: at-load
        rowCount: at-load
      sql: at-load
    snapshot-to-databricks@v1:
      library:
        nullValues: at-load
        missingValues: at-load
        invalidValues: at-load
        duplicateValues: at-load
        rowCount: at-load
      sql: at-load
configurationSchema: ./configuration.schema.json
planner:
  apiVersion: ingestron.provider-planning/v1
  module: ./index.mjs
renderer:
  apiVersion: ingestron.provider-generation/v1
  module: ./index.mjs
activities:
  copy: ./activities/copy/activity.yaml
standards:
  - id: metadata-snapshot-land@v1
    description: Reviewed metadata coordinator and reusable SQL snapshot worker
    sourceKinds:
      - azure-sql
      - sql-server
    dataFlow: forbidden
  - id: snapshot-land@v1
    description: Frozen SQL source to guarded Parquet landing
    sourceKinds:
      - azure-sql
      - sql-server
    dataFlow: forbidden
  - id: immutable-file-copy@v1
    description: One completed immutable file to binary-preserving landing
    sourceKinds:
      - adls
      - sftp
    dataFlow: forbidden
  - id: snapshot-to-databricks@v1
    description: Copy a frozen SQL snapshot and invoke conditional Databricks publication
    sourceKinds:
      - azure-sql
      - sql-server
    dataFlow: forbidden
commands:
  apiVersion: ingestron.provider-commands/v1
  execution: offline-json
  module: ./commands.mjs
  definitions:
    - name: discover import
      description:
        Review supplied table metadata as contract proposals; no source
        connection or file changes.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - tables
        properties:
          tables:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: object
              additionalProperties: false
              required:
                - name
                - columns
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                columns:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - name
                      - type
                      - nullable
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 128
                      type:
                        type: string
                        minLength: 1
                        maxLength: 64
                      nullable:
                        type: boolean
    - name: deploy inspect
      description:
        Inspect supplied native deployment assets; no live validation,
        target diff or deployment.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - artifact
        properties:
          artifact:
            type: object
    - name: discover route
      description:
        Generate the metadata pipeline for a native connection flow whose
        source is not reachable locally; no Azure calls.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - flow
          - kind
          - source
          - tables
          - binding
        properties:
          flow:
            type: string
            minLength: 1
            maxLength: 100
          kind:
            type: string
            minLength: 1
            maxLength: 50
          source:
            type: object
          tables:
            type: object
          target:
            type: object
          binding:
            type: object
          connectionBinding:
            type: object
    - name: connection prepare
      description: Prepare a project-resolved connection, selected fields and
        runtime-only secrets
      inputSchema:
        type: object
        additionalProperties: true
    - name: connector contracts
      description: Export reviewed ODCS contracts
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - review
        properties:
          review:
            type: object
    - name: compute prepare
      description:
        Prepare a bounded managed-identity Batch pipeline for a reviewed
        Python workload; no deployment or pool changes.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - factoryName
          - pipelineName
          - batchAccountUrl
          - poolName
          - workerIdentityResourceId
          - storageAccount
          - resourceFolder
          - files
          - entryPoint
          - configFile
          - timeout
          - pollIntervalSeconds
          - recovery
        properties:
          pythonExecutable:
            type: string
            minLength: 1
          factoryName:
            type: string
            minLength: 1
          pipelineName:
            type: string
            minLength: 1
          batchAccountUrl:
            type: string
            minLength: 1
          poolName:
            type: string
            minLength: 1
          workerIdentityResourceId:
            type: string
            minLength: 1
          storageAccount:
            type: string
            minLength: 1
          resourceFolder:
            type: string
            minLength: 1
          files:
            type: array
            items:
              type: string
            minItems: 1
            maxItems: 100
          entryPoint:
            type: string
            minLength: 1
          configFile:
            type: string
            minLength: 1
          timeout:
            type: string
            minLength: 1
          pollIntervalSeconds:
            type: integer
          recovery:
            type: string
            minLength: 1
    - name: compute pool prepare
      description:
        Prepare a shared pool Spot autoscale policy; operator review and
        Azure evaluation required before applying.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - maxNodes
        properties:
          maxNodes:
            type: integer
    - name: discover source prepare
      description:
        Prepare a bounded SQL or format-specific file metadata reader; no
        source access inside the CLI.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - sourceId
          - sourceKind
        properties:
          sourceId:
            type: string
            minLength: 1
            maxLength: 512
          sourceKind:
            enum:
              - azure-sql
              - adls
          format:
            enum:
              - csv
              - tsv
              - json
              - jsonl
              - parquet
              - xml
              - xlsx
          schemas:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 512
          tables:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 512
          sampleRows:
            type: integer
          datasets:
            type: array
            maxItems: 100
            items:
              type: object
              additionalProperties: false
              required:
                - name
                - paths
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 512
                paths:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
                    maxLength: 512
                sheet:
                  type: string
                  minLength: 1
                  maxLength: 512
                partitionColumns:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 512
    - name: discover prepare
      description:
        Generate a metadata-only ADF Copy pipeline and runnable deployment
        bundle; no Azure calls.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - useCase
          - factoryName
          - location
          - mode
          - sourceKind
          - sourceLinkedService
          - sinkLinkedService
          - fileSystem
          - schemas
        properties:
          useCase:
            type: string
            minLength: 1
            maxLength: 128
          factoryName:
            type: string
            minLength: 1
            maxLength: 128
          location:
            type: string
            minLength: 1
            maxLength: 128
          mode:
            enum:
              - new-factory
              - existing-factory
          sourceKind:
            enum:
              - azure-sql
              - sql-server
              - postgresql
              - mysql
              - oracle
          sourceLinkedService:
            type: string
            minLength: 1
            maxLength: 128
          sinkLinkedService:
            type: string
            minLength: 1
            maxLength: 128
          fileSystem:
            type: string
            minLength: 1
            maxLength: 128
          tables:
            type: array
            maxItems: 100
            items:
              type: string
              minLength: 1
              maxLength: 128
          schemas:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 128
    - name: discover contracts
      description:
        Convert exported catalogue rows into draft ODCS files for review;
        keys require explicit acceptance.
      inputSchema:
        oneOf:
          - type: object
            additionalProperties: false
            required:
              - sourceId
              - sourceKind
              - rows
            properties:
              sourceId:
                type: string
                minLength: 1
                maxLength: 128
              sourceKind:
                enum:
                  - azure-sql
                  - sql-server
                  - postgresql
                  - mysql
                  - oracle
              acceptDeclaredKeys:
                type: boolean
              rows:
                type: array
                minItems: 1
                maxItems: 10000
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - schema_name
                    - table_name
                    - column_name
                    - ordinal_position
                    - data_type
                    - nullable
                    - primary_key
                  properties:
                    schema_name:
                      type: string
                      minLength: 1
                      maxLength: 128
                    table_name:
                      type: string
                      minLength: 1
                      maxLength: 128
                    column_name:
                      type: string
                      minLength: 1
                      maxLength: 128
                    ordinal_position:
                      type: integer
                    data_type:
                      type: string
                      minLength: 1
                      maxLength: 128
                    nullable:
                      enum:
                        - true
                        - false
                        - 0
                        - 1
                    primary_key:
                      enum:
                        - true
                        - false
                        - 0
                        - 1
                    precision:
                      type:
                        - integer
                        - "null"
                    scale:
                      type:
                        - integer
                        - "null"
                    max_length:
                      type:
                        - integer
                        - "null"
          - type: object
            additionalProperties: false
            required:
              - apiVersion
              - sourceId
              - sourceKind
              - format
              - datasets
            properties:
              apiVersion:
                enum:
                  - ingestron.file-metadata/v1
              sourceId:
                type: string
                minLength: 1
                maxLength: 512
              sourceKind:
                enum:
                  - adls
              format:
                enum:
                  - csv
                  - tsv
                  - json
                  - jsonl
                  - parquet
                  - xml
                  - xlsx
              datasets:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: object
    - name: deploy prepare
      description: Prepare a reviewed discovery deployment bundle for a new or
        existing factory; no Azure calls.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - useCase
          - factoryName
          - location
          - mode
          - sourceKind
          - sourceLinkedService
          - sinkLinkedService
          - fileSystem
          - schemas
        properties:
          useCase:
            type: string
            minLength: 1
            maxLength: 128
          factoryName:
            type: string
            minLength: 1
            maxLength: 128
          location:
            type: string
            minLength: 1
            maxLength: 128
          mode:
            enum:
              - new-factory
              - existing-factory
          sourceKind:
            enum:
              - azure-sql
              - sql-server
              - postgresql
              - mysql
              - oracle
          sourceLinkedService:
            type: string
            minLength: 1
            maxLength: 128
